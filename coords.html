<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坐标转换</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --glow: rgba(78, 201, 176, 0.18);
            --card: #ffffff;
            --line: #e6e9ee;
            --text: #1f2933;
            --text-dim: #6b7785;
            --accent: #2f9e7f;
            --accent-soft: rgba(47, 158, 127, 0.10);
            --field: #f7f9fb;
            --shadow: 0 2px 10px rgba(23, 42, 58, 0.06);
            --shadow-lg: 0 12px 28px rgba(23, 42, 58, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171a1f;
                --glow: rgba(78, 201, 176, 0.10);
                --card: #22262d;
                --line: #313741;
                --text: #e8ebef;
                --text-dim: #98a2ae;
                --accent: #4ec9b0;
                --accent-soft: rgba(78, 201, 176, 0.14);
                --field: #1b1f25;
                --shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
                --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.36);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            padding: 20px 14px 40px;
            background:
                radial-gradient(900px 420px at 50% -180px, var(--glow), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .app { width: 100%; max-width: 460px; margin: 0 auto; }

        .top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 2px 16px;
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            box-shadow: var(--shadow);
            color: var(--text-dim);
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
        }

        .back:active { transform: scale(0.97); }

        .title-wrap { min-width: 0; }

        h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub {
            font-size: 12.5px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 16px 16px 18px;
        }

        /* ---------- 世界分组（上下两排） ---------- */
        .group { min-width: 0; }

        .group-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .group-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: var(--text);
        }

        .group-badge {
            flex: none;
            font-size: 11.5px;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 6px;
            padding: 2px 7px;
        }

        .pair {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .field { display: block; min-width: 0; }

        .label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 48px;
            padding: 0 12px;
            font: inherit;
            font-size: 16px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input::placeholder { color: var(--text-dim); opacity: 0.65; }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 两排之间的联动说明 */
        .link {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 2px;
            font-size: 11.5px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .link::before,
        .link::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        /* ---------- 对照 ---------- */
        .result {
            margin-top: 16px;
            padding: 12px 12px 10px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .line {
            padding: 8px 10px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            background: var(--card);
            border: 1px dashed var(--line);
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .line + .line { margin-top: 6px; }

        .int {
            margin-top: 8px;
            padding: 0 2px;
            font-size: 12px;
            line-height: 1.7;
            color: var(--text-dim);
            overflow-wrap: anywhere;
        }

        /* ---------- 说明 ---------- */
        .tip {
            margin-top: 18px;
            padding-top: 13px;
            border-top: 1px dashed var(--line);
            font-size: 12.5px;
            line-height: 1.8;
            color: var(--text-dim);
        }

        .tip + .tip { margin-top: 10px; padding-top: 0; border-top: 0; }

        .tip strong { color: var(--text); font-weight: 600; }

        .tip code {
            display: inline-block;
            white-space: nowrap;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 5px;
            padding: 1px 5px;
        }

        .foot {
            margin-top: 16px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .foot a { color: var(--accent); text-decoration: none; }

        .foot a:hover { text-decoration: underline; }

        @media (max-width: 359px) {
            input { padding: 0 8px; }
            .line { font-size: 12px; padding: 7px 8px; }
        }

        @media (min-width: 560px) {
            body { padding: 34px 20px 48px; }
            h1 { font-size: 22px; }
            .card { padding: 20px 22px 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            input, .back { transition: none; }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top">
            <a class="back" href="index.html">← 工具箱</a>
            <div class="title-wrap">
                <h1>坐标转换</h1>
                <p class="sub">主世界 ↔ 地狱 · 水平 1:8 实时联动</p>
            </div>
        </div>

        <main class="card">
            <section class="group" aria-labelledby="owTitle">
                <div class="group-head">
                    <span class="group-name" id="owTitle">主世界</span>
                    <span class="group-badge">÷ 8 得地狱</span>
                </div>
                <div class="pair">
                    <label class="field" for="owX">
                        <span class="label">X</span>
                        <input type="number" id="owX" inputmode="decimal" step="any" placeholder="0"
                            autocomplete="off" enterkeyhint="next">
                    </label>
                    <label class="field" for="owZ">
                        <span class="label">Z</span>
                        <input type="number" id="owZ" inputmode="decimal" step="any" placeholder="0"
                            autocomplete="off" enterkeyhint="next">
                    </label>
                </div>
            </section>

            <div class="link">÷ 8 ↓ · ↑ × 8</div>

            <section class="group" aria-labelledby="nTitle">
                <div class="group-head">
                    <span class="group-name" id="nTitle">地狱</span>
                    <span class="group-badge">× 8 得主世界</span>
                </div>
                <div class="pair">
                    <label class="field" for="nX">
                        <span class="label">X</span>
                        <input type="number" id="nX" inputmode="decimal" step="any" placeholder="0"
                            autocomplete="off" enterkeyhint="next">
                    </label>
                    <label class="field" for="nZ">
                        <span class="label">Z</span>
                        <input type="number" id="nZ" inputmode="decimal" step="any" placeholder="0"
                            autocomplete="off" enterkeyhint="done">
                    </label>
                </div>
            </section>

            <section class="result" aria-label="对照与取整建议">
                <p class="line" id="owLine">主世界：—</p>
                <p class="line" id="nLine">地狱：—</p>
                <p class="int" id="intText">取整建议：—</p>
            </section>

            <p class="tip">
                <strong>换算规则：</strong>水平方向 1:8，<code>主世界 ÷ 8 = 地狱</code>，<code>地狱 × 8 = 主世界</code>。
                两排实时联动：修改任意一排的 X / Z，另一排同轴坐标立即更新；结果保留一位小数，负数、0 和纯小数都可以。
            </p>
            <p class="tip">
                <strong>取整建议：</strong>传送门只能落在整数格上，下方建议坐标按四舍五入取最近的整数。
                地狱侧差 0.5 格，换算到主世界会放大成 4 格，需要精确对接时建议先在目标一侧取整再换算。
            </p>
        </main>

        <p class="foot"><a href="mappaint.html">→ 地图画坐标</a></p>
    </div>

    <script>
        (function () {
            var owX = document.getElementById('owX');
            var owZ = document.getElementById('owZ');
            var nX = document.getElementById('nX');
            var nZ = document.getElementById('nZ');
            var owLine = document.getElementById('owLine');
            var nLine = document.getElementById('nLine');
            var intText = document.getElementById('intText');

            // 空串或非法输入返回 null，避免把空值当成 0
            function read(input) {
                var raw = input.value.trim();
                if (raw === '') return null;
                var n = Number(raw);
                return isFinite(n) ? n : null;
            }

            // 对称四舍五入（-1.25 → -1.3），避免 Math.round 对负数进位方向不一致
            function roundTo(n, digits) {
                var p = Math.pow(10, digits);
                var r = Math.round(Math.abs(n) * p + 1e-9) / p;
                return n < 0 ? -r : r;
            }

            // 保留一位小数，整数不带 ".0"，并消除 -0
            function fmt(n) {
                var v = roundTo(n, 1);
                if (v === 0) v = 0;
                return Number.isInteger(v) ? String(v) : v.toFixed(1);
            }

            function fmtInt(n) {
                var v = roundTo(n, 0);
                if (v === 0) v = 0;
                return String(v);
            }

            function show(n) {
                return n === null ? '—' : fmt(n);
            }

            function showInt(n) {
                return n === null ? '—' : fmtInt(n);
            }

            // 只更新同轴的那一个输入框，另一轴保持用户已填内容
            function sync(source, target, factor) {
                var v = read(source);
                if (v === null) {
                    target.value = '';
                } else {
                    target.value = fmt(v * factor);
                }
                renderSummary();
            }

            function renderSummary() {
                var ox = read(owX);
                var oz = read(owZ);
                var nx = read(nX);
                var nz = read(nZ);

                owLine.textContent = '主世界：X ' + show(ox) + ' / Z ' + show(oz);
                nLine.textContent = '地狱：X ' + show(nx) + ' / Z ' + show(nz);

                if (ox === null && oz === null && nx === null && nz === null) {
                    intText.textContent = '取整建议：填写任意一排的 X 或 Z 即可';
                    return;
                }

                intText.textContent = '取整建议：主世界 X ' + showInt(ox) + ' / Z ' + showInt(oz) +
                    '；地狱 X ' + showInt(nx) + ' / Z ' + showInt(nz);
            }

            // 四个字段两两成对：目标值 = 源值 × factor
            [
                [owX, nX, 1 / 8],
                [nX, owX, 8],
                [owZ, nZ, 1 / 8],
                [nZ, owZ, 8]
            ].forEach(function (pair) {
                pair[0].addEventListener('input', function () {
                    sync(pair[0], pair[1], pair[2]);
                });
            });

            renderSummary();
        })();
    </script>
</body>

</html>
