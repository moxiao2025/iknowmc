<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图画坐标</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --glow: rgba(78, 201, 176, 0.18);
            --card: #ffffff;
            --line: #e6e9ee;
            --text: #1f2933;
            --text-dim: #6b7785;
            --accent: #2f9e7f;
            --accent-soft: rgba(47, 158, 127, 0.10);
            --field: #f7f9fb;
            --shadow: 0 2px 10px rgba(23, 42, 58, 0.06);
            --shadow-lg: 0 12px 28px rgba(23, 42, 58, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171a1f;
                --glow: rgba(78, 201, 176, 0.10);
                --card: #22262d;
                --line: #313741;
                --text: #e8ebef;
                --text-dim: #98a2ae;
                --accent: #4ec9b0;
                --accent-soft: rgba(78, 201, 176, 0.14);
                --field: #1b1f25;
                --shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
                --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.36);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            padding: 20px 14px 40px;
            background:
                radial-gradient(900px 420px at 50% -180px, var(--glow), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .app { width: 100%; max-width: 520px; margin: 0 auto; }

        /* ---------- 顶部 ---------- */
        .top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 2px 16px;
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            box-shadow: var(--shadow);
            color: var(--text-dim);
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
        }

        .back:active { transform: scale(0.97); }

        .title-wrap { min-width: 0; }

        h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub {
            font-size: 12.5px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- 卡片 ---------- */
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 18px 16px;
        }

        .card + .card { margin-top: 14px; }

        .inputs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .field { display: block; min-width: 0; }

        .label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 48px;
            padding: 0 12px;
            font: inherit;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }

        input::placeholder { color: var(--text-dim); opacity: 0.7; }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ---------- 画幅尺寸 ---------- */
        .size {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--line);
        }

        .size-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .size-cell { display: block; position: relative; min-width: 0; }

        .size-cell input { padding-right: 34px; }

        .size-unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .times {
            font-size: 15px;
            color: var(--text-dim);
            padding: 0 1px;
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            min-height: 34px;
            padding: 0 12px;
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-dim);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .18s, color .18s, border-color .18s, transform .12s;
        }

        .chip:active { transform: scale(0.97); }

        .chip[aria-pressed="true"] {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: rgba(47, 158, 127, 0.4);
        }

        /* ---------- 结果 ---------- */
        .result { padding-top: 16px; }

        .empty {
            padding: 26px 4px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
        }

        .hidden { display: none !important; }

        .hero {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0 14px;
        }

        .hero-text { flex: 1; min-width: 0; }

        .hero-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 3px;
        }

        .hero-value {
            font-family: Consolas, "Courier New", monospace;
            font-variant-numeric: tabular-nums;
            font-size: clamp(20px, 6.4vw, 26px);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: 0.2px;
            color: var(--accent);
            overflow-wrap: anywhere;
        }

        .copy {
            flex: none;
            min-height: 44px;
            padding: 0 14px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(47, 158, 127, 0.35);
            border-radius: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: transform .12s, filter .18s;
        }

        .copy:active { transform: scale(0.96); }
        .copy:hover { filter: brightness(1.04); }

        .rows { display: block; }

        .row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px dashed var(--line);
        }

        .row:first-child { border-top: 0; padding-top: 0; }

        .row dt {
            flex: none;
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .row dd {
            min-width: 0;
            text-align: right;
            font-family: Consolas, "Courier New", monospace;
            font-variant-numeric: tabular-nums;
            font-size: 13.5px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .row dd .muted {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-dim);
        }

        .note {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            line-height: 1.75;
            color: var(--text-dim);
        }

        .note code {
            display: inline-block;
            white-space: nowrap;
            font-family: Consolas, "Courier New", monospace;
            font-size: 11.5px;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 5px;
            padding: 1px 5px;
        }

        @media (min-width: 560px) {
            body { padding: 34px 20px 48px; }
            h1 { font-size: 22px; }
            .card { padding: 22px 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            input, .back, .chip, .copy { transition: none; }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top">
            <a class="back" href="index.html">← 工具箱</a>
            <div class="title-wrap">
                <h1>地图画坐标</h1>
                <p class="sub">输入任意 X / Z，计算最近可用的地图画左上角</p>
            </div>
        </div>

        <main class="card">
            <div class="inputs">
                <label class="field" for="posX">
                    <span class="label">X 坐标</span>
                    <input type="number" id="posX" inputmode="decimal" step="any" placeholder="例如 -65" autocomplete="off">
                </label>
                <label class="field" for="posZ">
                    <span class="label">Z 坐标</span>
                    <input type="number" id="posZ" inputmode="decimal" step="any" placeholder="例如 200" autocomplete="off">
                </label>
            </div>

            <div class="size">
                <span class="label">地图画尺寸(可选)</span>
                <div class="size-row">
                    <label class="size-cell" for="mapW">
                        <input type="number" id="mapW" inputmode="numeric" min="1" max="64" step="1" value="2" autocomplete="off">
                        <span class="size-unit"></span>
                    </label>
                    <span class="times">×</span>
                    <label class="size-cell" for="mapH">
                        <input type="number" id="mapH" inputmode="numeric" min="1" max="64" step="1" value="2" autocomplete="off">
                        <span class="size-unit"></span>
                    </label>
                </div>
                <div class="presets" id="presets">
                    <button type="button" class="chip" data-w="2" data-h="2" aria-pressed="false">2 × 2</button>
                    <button type="button" class="chip" data-w="3" data-h="9" aria-pressed="false">3 × 3</button>
                    <button type="button" class="chip" data-w="9" data-h="9" aria-pressed="false">9 × 9</button>
                </div>
            </div>
        </main>

        <section class="card result" aria-live="polite">
            <p class="empty" id="empty">输入 X 和 Z 坐标，结果会立即显示</p>

            <div id="output" class="hidden">
                <div class="hero">
                    <div class="hero-text">
                        <div class="hero-label">左上角（西北角）</div>
                        <div class="hero-value" id="heroValue">—</div>
                    </div>
                    <button type="button" class="copy" id="copyBtn">复制</button>
                </div>

                <dl class="rows">
                    <div class="row">
                        <dt>所在格范围</dt>
                        <dd id="tileRange">—</dd>
                    </div>
                    <div class="row">
                        <dt>最近格角</dt>
                        <dd id="nearest">—</dd>
                    </div>
                    <div class="row">
                        <dt>需要移动</dt>
                        <dd id="move">—</dd>
                    </div>
                    <div class="row hidden" id="artRow">
                        <dt>整幅覆盖</dt>
                        <dd id="artRange">—</dd>
                    </div>
                    <div class="row hidden" id="sizeRow">
                        <dt>画布尺寸</dt>
                        <dd id="artSize">—</dd>
                    </div>
                </dl>

                <p class="note">
                    玩家从北向南看，左上角即西北角，也是整格的最小 X、最小 Z。<br>
                    格网 <code>x、z ≡ 64 (mod 128)</code>，每格 128 × 128，负坐标按向下取整处理。
                </p>
            </div>
        </section>
    </div>

    <script>
        (function () {
            const SIZE = 128;   // 一格地图的边长
            const ORIGIN = 64;  // 地图 0 覆盖 -64 ~ 63，格角满足 64 (mod 128)

            const posX = document.getElementById('posX');
            const posZ = document.getElementById('posZ');
            const mapW = document.getElementById('mapW');
            const mapH = document.getElementById('mapH');
            const presets = document.getElementById('presets');
            const chips = Array.prototype.slice.call(presets.querySelectorAll('.chip'));

            const empty = document.getElementById('empty');
            const output = document.getElementById('output');
            const heroValue = document.getElementById('heroValue');
            const tileRange = document.getElementById('tileRange');
            const nearestEl = document.getElementById('nearest');
            const moveEl = document.getElementById('move');
            const artRow = document.getElementById('artRow');
            const artRange = document.getElementById('artRange');
            const sizeRow = document.getElementById('sizeRow');
            const artSize = document.getElementById('artSize');
            const copyBtn = document.getElementById('copyBtn');

            let lastCopyText = '';

            // 所在格左上角（最小 X / 最小 Z）
            function corner(v) {
                return ORIGIN + SIZE * Math.floor((v - ORIGIN) / SIZE);
            }

            // 离 v 最近的格角，平局时取较大的一侧
            function nearestCorner(v) {
                return ORIGIN + SIZE * Math.round((v - ORIGIN) / SIZE);
            }

            function readNumber(input) {
                const raw = input.value.trim();
                if (raw === '') return null;
                const n = Number(raw);
                return isFinite(n) ? n : null;
            }

            function readSize(input) {
                const n = readNumber(input);
                if (n === null) return 1;
                return Math.min(64, Math.max(1, Math.floor(n)));
            }

            // 去掉多余的小数位，同时把 -0 变成 0
            function fmt(n) {
                if (!isFinite(n)) return '—';
                const rounded = Math.round(n * 100) / 100;
                return String(rounded === 0 ? 0 : rounded);
            }

            function signed(n) {
                return (n > 0 ? '+' : '') + fmt(n);
            }

            function direction(delta, axis) {
                if (delta === 0) return '';
                if (axis === 'x') return delta > 0 ? '东' : '西';
                return delta > 0 ? '南' : '北';
            }

            function moveText(dx, dz) {
                if (dx === 0 && dz === 0) return '已在格角上，无需移动';
                const partX = dx === 0 ? 'X 已对齐' : 'X ' + signed(dx) + '（' + direction(dx, 'x') + '）';
                const partZ = dz === 0 ? 'Z 已对齐' : 'Z ' + signed(dz) + '（' + direction(dz, 'z') + '）';
                return partX + ' / ' + partZ;
            }

            function syncChips(w, h) {
                chips.forEach(function (chip) {
                    const on = Number(chip.dataset.w) === w && Number(chip.dataset.h) === h;
                    chip.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
            }

            function render() {
                const x = readNumber(posX);
                const z = readNumber(posZ);

                if (x === null || z === null) {
                    output.classList.add('hidden');
                    empty.classList.remove('hidden');
                    lastCopyText = '';
                    return;
                }

                const w = readSize(mapW);
                const h = readSize(mapH);
                syncChips(w, h);

                const left = corner(x);
                const top = corner(z);
                const nearX = nearestCorner(x);
                const nearZ = nearestCorner(z);
                const endX = left + SIZE * w - 1;
                const endZ = top + SIZE * h - 1;

                heroValue.textContent = 'X ' + left + ' / Z ' + top;
                tileRange.textContent = 'X ' + left + ' ~ ' + (left + SIZE - 1) +
                    ' / Z ' + top + ' ~ ' + (top + SIZE - 1);
                nearestEl.textContent = 'X ' + nearX + ' / Z ' + nearZ;
                moveEl.textContent = moveText(nearX - x, nearZ - z);

                if (w > 1 || h > 1) {
                    artRange.textContent = 'X ' + left + ' ~ ' + endX + ' / Z ' + top + ' ~ ' + endZ;
                    artSize.textContent = (SIZE * w) + ' × ' + (SIZE * h) + ' 格' +
                        '（' + w + ' × ' + h + ' 张）';
                    artRow.classList.remove('hidden');
                    sizeRow.classList.remove('hidden');
                } else {
                    artRow.classList.add('hidden');
                    sizeRow.classList.add('hidden');
                }

                lastCopyText = 'X ' + left + ' / Z ' + top;
                output.classList.remove('hidden');
                empty.classList.add('hidden');
            }

            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                return new Promise(function (resolve, reject) {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy') ? resolve() : reject();
                    } catch (err) {
                        reject(err);
                    } finally {
                        ta.remove();
                    }
                });
            }

            copyBtn.addEventListener('click', function () {
                if (!lastCopyText) return;
                const text = lastCopyText;
                copyText(text).then(function () {
                    copyBtn.textContent = '已复制';
                    setTimeout(function () { copyBtn.textContent = '复制'; }, 1200);
                }).catch(function () {
                    copyBtn.textContent = '复制失败';
                    setTimeout(function () { copyBtn.textContent = '复制'; }, 1200);
                });
            });

            chips.forEach(function (chip) {
                chip.addEventListener('click', function () {
                    mapW.value = chip.dataset.w;
                    mapH.value = chip.dataset.h;
                    render();
                });
            });

            [posX, posZ, mapW, mapH].forEach(function (input) {
                input.addEventListener('input', render);
            });

            // 失焦时把宽高修正到 1 ~ 64 的整数
            [mapW, mapH].forEach(function (input) {
                input.addEventListener('change', function () {
                    input.value = readSize(input);
                    render();
                });
            });

            // 光标在 X 输入框时按回车跳到 Z
            posX.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    posZ.focus();
                }
            });

            render();
        })();
    </script>
</body>

</html>
