<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iKnowMC 工具箱</title>

<script>
/* ============================================================
   功能入口配置（新增功能只需在数组里加一行）
   name:  入口名称（显示在卡片上，占位图标取它的首字）
   url:   页面路径（相对本文件）
   icon:  icon 目录下的文件名，留空或文件缺失时显示占位色块
   group: 所属分组（同组卡片排在一起，组按首次出现顺序排列）
   desc:  可选的简介
   ============================================================ */
const APPS = [
  { name: "投影技巧",     url: "litematica.html",    icon: "litematica.webp", group: "MC", desc: "Litematica 投影与投影打印机使用说明" },
  { name: "附魔指令生成", url: "enchanted.html",     icon: "enchanted.webp",  group: "MC", desc: "按等级生成 MC 附魔指令" },
  { name: "附魔检测",     url: "附魔检测.html",      icon: "",                group: "MC", desc: "村民交易所附魔检测" },
  { name: "Fabric 模组推荐", url: "mods.html",       icon: "",                group: "MC", desc: "比较好用的模组的分类及介绍" },
  { name: "比例换算",     url: "ratio.html",         icon: "",                group: "w2i", desc: "游戏币比例计算" },
  { name: "倒计时",       url: "countdown.html",     icon: "",                group: "w2i", desc: "副本boss技能循环倒计时" },
  { name: "大盗宝藏",     url: "ddcb.html",          icon: "",                group: "qn2", desc: "九宫、等差数列等计算工具" },
  { name: "地图画坐标",   url: "mappaint.html",      icon: "",                group: "MC", desc: "地图画顶点坐标计算" },
  { name: "坐标转换",     url: "coords.html",        icon: "",                group: "MC", desc: "主世界与地狱坐标双向换算" },
  { name: "旗帜生成",     url: "banner.html",        icon: "",                group: "MC", desc: "用原版掩码逐层叠加预览旗帜与盾牌" },
];
</script>

<style>
  :root {
    --bg: #f0f2f5;
    --bg-glow: rgba(78, 201, 176, 0.18);
    --card: #ffffff;
    --card-hover: #ffffff;
    --line: #e6e9ee;
    --text: #1f2933;
    --text-dim: #6b7785;
    --accent: #2f9e7f;
    --shadow: 0 2px 10px rgba(23, 42, 58, 0.06);
    --shadow-hover: 0 12px 28px rgba(23, 42, 58, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171a1f;
      --bg-glow: rgba(78, 201, 176, 0.10);
      --card: #22262d;
      --card-hover: #272c34;
      --line: #313741;
      --text: #e8ebef;
      --text-dim: #98a2ae;
      --accent: #4ec9b0;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
      --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.42);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    padding: 28px 16px 40px;
    background:
      radial-gradient(900px 420px at 50% -160px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; }

  header { padding: 8px 4px 24px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .brand-mark {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.5px;
    color: #fff;
    background: linear-gradient(145deg, #43b894, #2b8f73);
    box-shadow: 0 6px 16px rgba(47, 158, 127, 0.28);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    padding-left: 54px;
  }

  .groups { display: flex; flex-direction: column; }

  /* 组与组之间的分隔线 */
  .group + .group {
    margin-top: 26px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .group-head::before {
    content: "";
    flex: none;
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: var(--accent);
  }

  .group-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--text);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    header { padding-bottom: 28px; }
    h1 { font-size: 26px; }
    .group-title { font-size: 16px; }
  }

  @media (min-width: 1000px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    body { padding-top: 48px; }
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    min-height: 152px;
    padding: 20px 14px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: rgba(47, 158, 127, 0.35);
    box-shadow: var(--shadow-hover);
  }

  .card:active { transform: translateY(-1px) scale(0.99); }

  .card:focus-visible {
    outline: 3px solid rgba(47, 158, 127, 0.55);
    outline-offset: 2px;
  }

  .icon {
    position: relative;
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    user-select: none;
  }

  .icon img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-word;
  }

  .desc {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .desc:empty { display: none; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">iK</div>
      <h1>iKnowMC 工具箱</h1>
    </div>
    <p class="subtitle">我的世界实用工具与文档，点选下方图标进入。</p>
  </header>

  <main class="groups" id="groups"></main>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  const groups = document.getElementById("groups");
  const footer = document.getElementById("footer");

  // 未填写 group 的入口统一放进这个默认组
  const DEFAULT_GROUP = "其他工具";

  // 占位色板：按入口顺序轮换，保证相邻卡片颜色不重复
  const PALETTE = [
    ["#43b894", "#2b8f73"],
    ["#5b8def", "#3c63c4"],
    ["#e0915a", "#bd6c34"],
    ["#a07bd8", "#7a55bb"],
    ["#4fb6c9", "#2f8b9d"],
    ["#d97a95", "#b25470"]
  ];

  function initialOf(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return "?";
    const first = Array.from(trimmed)[0];
    // 英文字母统一大写；中文取首字
    return /[a-z]/.test(first) ? first.toUpperCase() : first;
  }

  function makeIcon(app, index) {
    const icon = document.createElement("div");
    icon.className = "icon";

    const colors = PALETTE[index % PALETTE.length];
    icon.style.background = "linear-gradient(145deg, " + colors[0] + ", " + colors[1] + ")";
    icon.textContent = initialOf(app.name);
    icon.setAttribute("aria-hidden", "true");

    if (app.icon) {
      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.src = "icon/" + app.icon;
      // 加载失败时移除图片，露出底层色块占位，避免破图
      img.addEventListener("error", function () { img.remove(); });
      icon.appendChild(img);
    }
    return icon;
  }

  function makeCard(app, index) {
    const card = document.createElement("a");
    card.className = "card";
    card.href = app.url;
    card.title = app.name;

    card.appendChild(makeIcon(app, index));

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = app.name;
    card.appendChild(name);

    if (app.desc) {
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = app.desc;
      card.appendChild(desc);
    }
    return card;
  }

  // 按 group 归组；Map 保证分组顺序与配置中首次出现的顺序一致
  const grouped = new Map();
  APPS.forEach(function (app) {
    const key = (app.group || "").trim() || DEFAULT_GROUP;
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(app);
  });

  let cardIndex = 0;
  grouped.forEach(function (apps, title) {
    const section = document.createElement("section");
    section.className = "group";

    const head = document.createElement("div");
    head.className = "group-head";
    const heading = document.createElement("h2");
    heading.className = "group-title";
    heading.textContent = title;
    head.appendChild(heading);
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";
    apps.forEach(function (app) {
      // 色板索引跨组连续递增，相邻卡片颜色不重复
      grid.appendChild(makeCard(app, cardIndex++));
    });

    section.appendChild(grid);
    groups.appendChild(section);
  });

  footer.textContent = "共 " + APPS.length + " 个入口";
})();
</script>
</body>
</html>
