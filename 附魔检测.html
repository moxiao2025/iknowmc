<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC村民交易所附魔检测</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --line: #e8e8e8;
            --line-soft: #eeeeee;
            --text: #222222;
            --text-strong: #333333;
            --text-dim: #666666;
            --field: #ffffff;
            --field-border: #cccccc;
            --surface: #fafafa;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --ok-bg: #ecfdf5;
            --ok-line: #a7f3d0;
            --ok-text: #047857;
            --bad-bg: #fff1f2;
            --bad-line: #fecdd3;
            --bad-text: #be123c;
            --shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171a1f;
                --card: #22262d;
                --line: #313741;
                --line-soft: #313741;
                --text: #e8ebef;
                --text-strong: #e8ebef;
                --text-dim: #98a2ae;
                --field: #1b1f25;
                --field-border: #3b424d;
                --surface: #272c34;
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --ok-bg: rgba(16,185,129,0.14);
                --ok-line: rgba(16,185,129,0.38);
                --ok-text: #6ee7b7;
                --bad-bg: rgba(244,63,94,0.14);
                --bad-line: rgba(244,63,94,0.38);
                --bad-text: #fda4af;
                --shadow: 0 2px 12px rgba(0,0,0,0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            padding: 20px 14px 40px;
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 返回按钮：与 ratio.html / countdown.html 保持一致 */
        .top {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 14px;
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            box-shadow: var(--shadow);
            color: var(--text-dim);
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
        }

        .back:active { transform: scale(0.97); }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        h1 {
            text-align: center;
            color: var(--text);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .block {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .block:last-child { margin-bottom: 0; }

        .block-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-strong);
            border-bottom: 1px solid var(--line-soft);
            padding-bottom: 8px;
            margin-bottom: 14px;
        }

        .block-title .hint {
            font-size: 13px;
            font-weight: normal;
            color: var(--text-dim);
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 10px;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--field-border);
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
        }

        textarea::placeholder { color: var(--text-dim); opacity: 0.75; }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .tip {
            color: var(--text-dim);
            font-size: 13px;
            margin: 8px 0;
        }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            margin-top: 6px;
            padding: 0 4px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .switch input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .results .block { margin-bottom: 0; }

        .list { min-width: 0; }

        .item {
            padding: 6px 10px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-word;
        }

        .item.have {
            background: var(--ok-bg);
            border: 1px solid var(--ok-line);
            color: var(--ok-text);
        }

        .item.miss {
            background: var(--bad-bg);
            border: 1px solid var(--bad-line);
            color: var(--bad-text);
        }

        .btn {
            display: block;
            width: 100%;
            min-height: 44px;
            margin-top: 14px;
            padding: 10px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--accent-hover); }

        .btn-copy { background: #10b981; }

        .btn-copy:hover { background: #059669; }

        @media (max-width: 760px) {
            body { padding: 16px 12px 32px; }
            .page { padding: 18px 14px; }
            h1 { font-size: 20px; margin-bottom: 16px; }
            .results { grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .block { padding: 16px 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
        }
    </style>
</head>
<body>

<div class="top">
    <a class="back" href="index.html">← 工具箱</a>
</div>

<div class="page">
    <h1>MC村民交易所附魔检测工具</h1>

    <section class="block">
        <h2 class="block-title">输入已拥有附魔<span class="hint">（换行 / 空格 / , / ，分隔）</span></h2>
        <textarea id="inputBox" placeholder="示例：
亡灵杀手,经验修补 横扫之刃，快速装填"></textarea>
        <p class="tip">严格模式默认开启：仅完整名称 / 预设别名可匹配；宽松模式开启后允许片段匹配（会有批量误匹配风险）</p>
        <label class="switch"><input type="checkbox" id="looseMode"> 宽松模式（片段模糊匹配，慎用）</label>
    </section>

    <div class="results">
        <section class="block">
            <h2 class="block-title">✅ 已匹配到的附魔</h2>
            <div id="haveList" class="list"></div>
        </section>
        <section class="block">
            <h2 class="block-title">❌ 还缺少的附魔（找村民刷这些）</h2>
            <div id="missList" class="list"></div>
            <button id="copyMissBtn" class="btn btn-copy">一键复制缺失附魔</button>
        </section>
    </div>
</div>

<script>
// 完整附魔库，name标准全名，alias预设简写别名
const enchantData = [
    {name:"保护",alias:["保护"]},
    {name:"火焰保护",alias:["火焰"]},
    {name:"爆炸保护",alias:["爆炸"]},
    {name:"弹射物保护",alias:["弹射","弹射物"]},
    {name:"摔落缓冲",alias:["摔落","缓冲"]},
    {name:"荆棘",alias:["荆棘"]},
    {name:"水下呼吸",alias:["水下呼吸","呼吸"]},
    {name:"水下速掘",alias:["水下速掘","速掘","水下挖掘","挖掘"]},
    {name:"深海探索者",alias:["深海","探索","深海探索"]},
    {name:"冰霜行者",alias:["冰霜","行者"]},
    {name:"锋利",alias:["锋利"]},
    {name:"亡灵杀手",alias:["亡灵"]},
    {name:"节肢杀手",alias:["节肢"]},
    {name:"击退",alias:["击退"]},
    {name:"火焰附加",alias:["附加"]},
    {name:"抢夺",alias:["抢夺"]},
    {name:"横扫之刃",alias:["横扫"]},
    {name:"效率",alias:["效率"]},
    {name:"精准采集",alias:["精准","采集"]},
    {name:"耐久",alias:["耐久"]},
    {name:"力量",alias:["力量"]},
    {name:"冲击",alias:["冲击"]},
    {name:"火矢",alias:["火矢"]},
    {name:"无限",alias:["无限"]},
    {name:"快速装填",alias:["快速","装填"]},
    {name:"多重射击",alias:["多重","射击"]},
    {name:"穿透",alias:["穿透"]},
    {name:"海之眷顾",alias:["海之眷顾","海之","眷顾"]},
    {name:"饵钓",alias:["饵钓"]},
    {name:"经验修补",alias:["经验","修补"]},
    {name:"消失诅咒",alias:["消失"]},
    {name:"绑定诅咒",alias:["绑定"]},
    {name:"忠诚",alias:["忠诚"]},
    {name:"穿刺",alias:["穿刺"]},
    {name:"引雷",alias:["引雷"]},
    {name:"激流",alias:["激流"]},
    {name:"风爆",alias:["风爆"]},
    {name:"致密",alias:["致密"]},
    {name:"破甲",alias:["破甲"]},
    {name:"突进",alias:["突进"]}
];

const inputBox = document.getElementById('inputBox');
const haveList = document.getElementById('haveList');
const missList = document.getElementById('missList');
const looseMode = document.getElementById('looseMode');
const copyMissBtn = document.getElementById('copyMissBtn');

let missCache = [];

function matchEnchant(userText){
    const userLines = userText.split(/[\n ,，]+/).map(s=>s.trim()).filter(s=>s);
    let matchedSet = new Set();

    for(let line of userLines){
        for(let e of enchantData){
            let hit = false;
            if(looseMode.checked){
                // 宽松：名字包含片段 或 别名片段匹配
                hit = e.name.includes(line) || e.alias.some(a=>a.includes(line));
            }else{
                // 严格模式：全名完全相等 或者 别名完全匹配
                hit = (e.name === line) || e.alias.some(a => a === line);
            }
            if(hit){
                matchedSet.add(e.name);
            }
        }
    }

    const allNames = enchantData.map(i=>i.name);
    const haveArr = Array.from(matchedSet);
    missCache = allNames.filter(n=>!matchedSet.has(n));

    haveList.innerHTML = haveArr.map(x=>`<div class="item have">${x}</div>`).join('');
    missList.innerHTML = missCache.map(x=>`<div class="item miss">${x}</div>`).join('');
}

// 复制缺失列表
copyMissBtn.addEventListener('click',async ()=>{
    await navigator.clipboard.writeText(missCache.join('\n'));
    alert("已复制缺失附魔到剪贴板");
});

inputBox.addEventListener('input',()=>matchEnchant(inputBox.value));
looseMode.addEventListener('change',()=>matchEnchant(inputBox.value));

matchEnchant("");
</script>
</body>
</html>
